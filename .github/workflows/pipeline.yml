name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Lint HTML
        run: npx --yes html-validate@11.17.0 index.html

      - name: Build Docker image
        run: docker build -t gexicodon/ci-cd-lab:latest .

      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --name ci-cd-lab-test -p 8080:80 gexicodon/ci-cd-lab:latest

          trap 'docker logs ci-cd-lab-test || true; docker rm -f ci-cd-lab-test >/dev/null 2>&1 || true' EXIT

          sleep 2

          if ! curl -s http://localhost:8080 | grep -q "Акчурин Глеб Тимурович"; then
            echo "Smoke test failed: expected content not found"
            exit 1
          else
            echo "Smoke test: OK"
          fi

  release:
    name: release
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
